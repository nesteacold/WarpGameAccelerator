name: Release Builder

on:
  push:
    tags:
      - 'v*' # Trigger khi push tag bắt đầu bằng 'v' (vd: v1.7.1)

# Cấp quyền ghi để tạo Release và upload file
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish WarpGameAccelerator
      run: |
        dotnet publish WarpGameAccelerator/WarpGameAccelerator.csproj -c Release -r win-x64 --self-contained -o ./Publish

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./Publish/WarpGameAccelerator.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
