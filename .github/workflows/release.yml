name: Release Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.16.1)'
        required: true
        type: string

# Cấp quyền ghi để tạo Release và upload file
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Resolve manual version
      id: version
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        $version = $env:VERSION_INPUT.TrimStart('v', 'V')
        if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') {
          Write-Error "Invalid version: $($env:VERSION_INPUT)"
          exit 1
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Publish WarpGameAccelerator
      run: |
        dotnet publish WarpGameAccelerator/WarpGameAccelerator.csproj `
          -c Release -r win-x64 --self-contained `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 `
          -p:FileVersion=${{ steps.version.outputs.VERSION }}.0 `
          -o ./Publish

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        files: ./Publish/WarpGameAccelerator.exe
        generate_release_notes: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
